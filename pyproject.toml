[project]
name = "groundtem-io"
version = "0.1.1"
description = "Unofficial Python reader and plotting utilities for GroundTEM .stb, .stn, and .sts files"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hyeonwoo Kang", email = "hykanghw@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
keywords = ["geophysics", "TEM", "TDEM", "electromagnetics", "GroundTEM", "stb", "stn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Kang-geophysics/groundtem-io"
Repository = "https://github.com/Kang-geophysics/groundtem-io"
Issues = "https://github.com/Kang-geophysics/groundtem-io/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtem_io"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
